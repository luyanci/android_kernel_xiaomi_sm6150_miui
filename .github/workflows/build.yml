name: Build Kernel
on:
  push:
  workflow_dispatch:
jobs:
  Build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - phoenix_ztc1997_defconfig
    env:
      ANYKERNEL3_FILE: "AnyKernel3-miui-phoenix-sukisuu"
    steps:
      - name: Set builddate
        id: generate-builddate
        run: echo "BUILDDATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      - name: Set swap to 10G
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: kernel
          #submodules: recursive
      - name: ⭐ Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git ftp lftp wget libarchive-tools ccache python2 python2-dev python3
          sudo apt-get install -y pngcrush schedtool dpkg-dev liblz4-tool make optipng maven device-tree-compiler
          sudo apt-get install -y libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc
          sudo apt-get install -y libxml2-utils libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools lzop flex tree
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev
          sudo apt-get install -y pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl
          sudo apt-get install -y zip unzip tar gzip bzip2 rar unrar llvm g++-multilib bison gperf zlib1g-dev automake
          
      - name: Get build tools
        run: |
          git clone https://github.com/luyanci/kernel_bulid --depth=1 -j$(nproc) tools
          
      - name: do something before build
        working-directory: kernel
        run: |
          git submodule update --init --recursive
          cd KernelSU
          git fetch
          git checkout origin/susfs-main
          cd ..
          chmod +x patch_kpm.sh
          ./patch_kpm.sh --download
          
      - name: Build Kernel
        working-directory: kernel
        run: >
          make O=out ARCH=arm64 CC=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/clang CROSS_COMPILE=$GITHUB_WORKSPACE/tools/toolgcc/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/tools/toolgcc/bin/arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- AR=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/llvm-ar HOSTCC=gcc HOSTCXX=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/clang++ NM=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/llvm-nm OBJCOPY=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/llvm-objcopy OBJDUMP=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/llvm-objdump STRIP=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/llvm-strip LD=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/ld.lld DTC_EXT=$GITHUB_WORKSPACE/tools/dtc vendor/${{matrix.defconfig}}
          
          make O=out ARCH=arm64 CC=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/clang CROSS_COMPILE=$GITHUB_WORKSPACE/tools/toolgcc/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/tools/toolgcc/bin/arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- AR=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/llvm-ar HOSTCC=gcc HOSTCXX=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/clang++ NM=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/llvm-nm OBJCOPY=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/llvm-objcopy OBJDUMP=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/llvm-objdump STRIP=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/llvm-strip LD=$GITHUB_WORKSPACE/tools/toolclang/clang-r428724/bin/ld.lld DTC_EXT=$GITHUB_WORKSPACE/tools/dtc -j$(nproc)
      - name: make anykernel3
        working-directory: kernel
        run: |
          cp ./out/arch/arm64/boot/Image.gz ./AnyKernel3/
          cp ./out/arch/arm64/boot/dtbo.img ./AnyKernel3/
          cp ./out/arch/arm64/boot/dts/qcom/sdmmagpie.dtb ./AnyKernel3/
          cd AnyKernel3/
          zip -q -r "${{ env.ANYKERNEL3_FILE }}.zip" *
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate-builddate.outputs.BUILDDATE }}
          files: ./kernel/AnyKernel3/${{ env.ANYKERNEL3_FILE }}.zip
